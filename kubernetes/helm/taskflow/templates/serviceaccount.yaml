# Least privilege taken to its limit: no Role, no RoleBinding, no token
# mounted. The application never calls the Kubernetes API, so the
# minimal RBAC is no credentials at all (ADR-0009).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskflow.serviceAccountName" . }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
automountServiceAccountToken: false
