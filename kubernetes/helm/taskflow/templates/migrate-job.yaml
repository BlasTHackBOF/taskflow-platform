# The migration Job as a Helm hook — the destination named by both the
# Compose init service and the raw manifest (ADR-0009, ADR-0010).
#
# post-install + pre-upgrade, NOT pre-install: pre-install hooks run
# before any release resource exists, so on a fresh install the Job
# would wait forever for a PostgreSQL the release had not yet created.
# post-install covers first deploy (nothing serves before readiness
# anyway); pre-upgrade covers every deploy after, which is where
# schema-before-code actually matters.
#
# before-hook-creation: the completed Job stays around for log
# inspection until the next rollout replaces it.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taskflow.fullname" . }}-migrate
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "taskflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "taskflow.serviceAccountName" . }}
      restartPolicy: Never
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        # Migrations retry-fail through backoffLimit if the database is
        # still booting (fresh install without --wait); waiting here
        # keeps the Job's own log clean of connection noise.
        - name: wait-for-postgres
          image: {{ include "taskflow.image" . | quote }}
          command:
            - python
            - -c
            - |
              import socket, sys, time
              deadline = time.time() + 120
              while time.time() < deadline:
                  try:
                      socket.create_connection(("{{ include "taskflow.postgres.fullname" . }}", 5432), timeout=2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit("postgres never became reachable")
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrate
          image: {{ include "taskflow.image" . | quote }}
          command: ["flask", "db", "upgrade"]
          env:
            - name: FLASK_APP
              value: wsgi.py
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskflow.fullname" . }}-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskflow.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            # Composed here so the Secret holds secrets and the chart
            # owns topology: renaming the postgres service via helpers
            # cannot strand a URL frozen inside the Secret.
            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "taskflow.postgres.fullname" . }}:5432/$(POSTGRES_DB)"
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
