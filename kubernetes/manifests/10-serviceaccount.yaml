# Minimal RBAC by construction: a dedicated ServiceAccount with NO Role
# or RoleBinding, and no API token mounted. The application never talks
# to the Kubernetes API, so the least privilege is not "a small role" —
# it is no credentials at all. Anything running as `default` would
# silently pick up whatever is ever granted to `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-app
  namespace: taskflow
automountServiceAccountToken: false
