# .example twin (ADR-0002): documents the expected keys; never holds
# real values. The real Secrets are created from the Ansible vault —
# the project's encrypted store of record — and never touch disk
# unencrypted:
#
#   VP=$(ansible-vault view ansible/group_vars/all/vault.yaml)
#   kubectl -n taskflow create secret generic taskflow-secrets \
#     --from-literal=SECRET_KEY="$(echo "$VP" | grep vault_flask_secret_key | cut -d'"' -f2)" \
#     --from-literal=POSTGRES_PASSWORD="$(echo "$VP" | grep vault_postgres_password | cut -d'"' -f2)" \
#     --from-literal=DATABASE_URL="postgresql+psycopg2://taskflow:$(echo "$VP" | grep vault_postgres_password | cut -d'"' -f2)@postgres:5432/taskflow"
#
# The GHCR pull secret (ADR-0004) is created the same way from
# vault_ghcr_read_token:
#
#   kubectl -n taskflow create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> \
#     --docker-password="$(echo "$VP" | grep vault_ghcr_read_token | cut -d'"' -f2)"
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Full SQLAlchemy URL — carries the password, hence Secret not ConfigMap.
  DATABASE_URL: "postgresql+psycopg2://taskflow:CHANGE_ME@postgres:5432/taskflow"
