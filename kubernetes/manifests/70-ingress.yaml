# Traefik ships with k3s and listens on the node's port 80 — the one
# port the security group opens to the world. No host rule: the node has
# no stable DNS name (its IP changes on every stop/start), so the
# Ingress answers on whatever address arrives.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
  namespace: taskflow
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow
                port:
                  name: http
