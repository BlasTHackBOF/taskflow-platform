[defaults]
inventory = inventory/terraform.sh
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/taskflow-operator
# Vault password lives at the repo root, gitignored — never in the repo.
vault_password_file = ../vault_pass.txt
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# Public IPs change on every stop/start, so strict known_hosts checking
# would fail on every fresh session; accept-new still pins the key after
# first contact.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
