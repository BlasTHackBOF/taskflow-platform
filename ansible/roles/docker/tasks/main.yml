---
- name: Install repository and API prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repo

- name: Refresh the apt cache after a repository change
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Install Docker Engine (pinned)
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_version }}"
      - "docker-ce-cli={{ docker_version }}"
      - "containerd.io={{ containerd_version }}"
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the operator users run Docker without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop:
    - "{{ admin_user }}"
    - ubuntu
