---
- name: Set the system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security updates
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    password: "{{ vault_admin_password_hash }}"
    groups: sudo
    append: true
    shell: /bin/bash
  no_log: true

- name: Authorise the operator key for the admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_key }}"

- name: Grant the admin user passwordless sudo
  ansible.builtin.copy:
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ admin_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Harden sshd (no root login, no password auth)
  ansible.builtin.copy:
    src: 00-taskflow-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-taskflow-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
