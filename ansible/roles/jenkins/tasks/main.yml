---
- name: Look up the docker group id
  ansible.builtin.getent:
    database: group
    key: docker

- name: Create the image build directory
  ansible.builtin.file:
    path: "{{ jenkins_build_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy the Jenkins image Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker/jenkins/Dockerfile"
    dest: "{{ jenkins_build_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: jenkins_dockerfile

- name: Build the Jenkins controller image (tools baked in)
  community.docker.docker_image:
    name: "{{ jenkins_image }}"
    source: build
    build:
      path: "{{ jenkins_build_dir }}"
    force_source: "{{ jenkins_dockerfile.changed }}"

- name: Create the Jenkins home volume
  community.docker.docker_volume:
    name: "{{ jenkins_volume }}"

# Home on a named volume: the container is disposable, /var/jenkins_home
# is not. The docker socket + docker group make the pipeline phase able
# to build images with the host's daemon.
- name: Run Jenkins
  community.docker.docker_container:
    name: jenkins
    image: "{{ jenkins_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ jenkins_http_port }}:8080"
    volumes:
      - "{{ jenkins_volume }}:/var/jenkins_home"
      - /var/run/docker.sock:/var/run/docker.sock
    groups:
      - "{{ ansible_facts.getent_group['docker'][1] }}"

- name: Wait for the Jenkins UI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}/login"
    status_code: 200
  register: jenkins_ui
  retries: 30
  delay: 5
  until: jenkins_ui.status == 200
